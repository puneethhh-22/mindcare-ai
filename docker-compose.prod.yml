version: "3.9"

# Production docker-compose – uses pre-built images and stricter settings.
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  mongodb:
    image: mongo:7.0
    container_name: mindcare_mongo_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD required}
      MONGO_INITDB_DATABASE: mindcare_db
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - mindcare_net
    # No exposed ports in production – only internal access

  redis:
    image: redis:7.2-alpine
    container_name: mindcare_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    networks:
      - mindcare_net

  backend:
    image: mindcare-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindcare_backend_prod
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    expose:
      - "8000"
    depends_on:
      - mongodb
      - redis
    networks:
      - mindcare_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: mindcare-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindcare_frontend_prod
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - mindcare_net

  nginx:
    image: nginx:1.25-alpine
    container_name: mindcare_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mindcare_net

volumes:
  mongo_data_prod:
  redis_data_prod:

networks:
  mindcare_net:
    driver: bridge
